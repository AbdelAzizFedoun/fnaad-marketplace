# FNAAD marketplace — production nginx configuration
#
# Layout (subdomains, so no base-path changes are needed in the apps):
#   api.your-domain.com   -> gunicorn (Django, :8000)
#   admin.your-domain.com -> fnaad-admin/dist  (Vite build)
#   www.your-domain.com   -> fnaad-frontend/dist (Expo web export, optional)
#
# Install:
#   sudo cp fnaad-nginx.conf /etc/nginx/sites-available/fnaad
#   sudo ln -s /etc/nginx/sites-available/fnaad /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.your-domain.com -d admin.your-domain.com -d www.your-domain.com
#   sudo nginx -t && sudo systemctl reload nginx

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.your-domain.com admin.your-domain.com www.your-domain.com;
    return 301 https://$host$request_uri;
}

# ---- Django API -------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.your-domain.com;

    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # Product photos, documents and voice notes can be large
    client_max_body_size 25m;

    # Gunicorn serves /api/... (and unprefixed fallbacks). WhiteNoise
    # inside Django also serves /static/, but nginx is faster for it.
    location /static/ {
        alias /opt/fnaad/fnaad-backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Uploaded media — NEVER served by Django in production (DEBUG=false)
    location /media/ {
        alias /opt/fnaad/fnaad-backend/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---- Admin panel (fnaad-admin/dist) -----------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name admin.your-domain.com;

    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    root /opt/fnaad/fnaad-admin/dist;
    index index.html;

    # SPA fallback for react-router
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---- Expo web build (optional) ----------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name www.your-domain.com;

    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    root /opt/fnaad/fnaad-frontend/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
