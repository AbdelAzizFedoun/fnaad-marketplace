version: 1

databases:
  - name: fnaad-db
    plan: free
    postgresVersion: 16
    region: frankfurt

services:
  - type: web
    name: fnaad-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: fnaad-backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fnaad-db
          property: connectionString
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "true"
      - key: SERVE_MEDIA
        value: "true"
      - key: SITE_BASE_URL
        value: https://fnaad-api.onrender.com
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        value: FNAAD Marketplace <fedounabdelaziz@gmail.com>
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FAPSHI_BASE_URL
        value: https://sandbox.fapshi.com
      - key: FAPSHI_APIUSER
        sync: false
      - key: FAPSHI_APIKEY
        sync: false

  - type: web
    name: fnaad-admin
    runtime: static
    plan: free
    region: frankfurt
    rootDir: fnaad-admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://fnaad-api.onrender.com/api
