version: 1

services:
  - type: web
    name: fnaad-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: fnaad-backend
    buildCommand: bash ./build.sh
    startCommand: python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://fnaad-admin.onrender.com,https://fnaad-api.onrender.com,https://fnaad-art.onrender.com,https://fnaad-web.onrender.com,https://fnaad-marketplace.com,https://www.fnaad-marketplace.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://fnaad-admin.onrender.com,https://fnaad-api.onrender.com,https://fnaad-art.onrender.com,https://fnaad-web.onrender.com,https://fnaad-marketplace.com,https://www.fnaad-marketplace.com"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SECURE
        value: "true"
      - key: SERVE_MEDIA
        value: "true"
      - key: SITE_BASE_URL
        value: https://fnaad-api.onrender.com
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        value: FNAAD Marketplace <fedounabdelaziz@gmail.com>
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: CAMPAY_BASE_URL
        sync: false
      - key: CAMPAY_USERNAME
        sync: false
      - key: CAMPAY_PASSWORD
        sync: false
      - key: CAMPAY_WEBHOOK_KEY
        sync: false
      - key: SUBSCRIPTION_PRICE_1_MONTH
        value: "10"
      - key: SUBSCRIPTION_PRICE_2_MONTHS
        value: "17"
      - key: SUBSCRIPTION_PRICE_3_MONTHS
        value: "25"
      - key: FAPSHI_BASE_URL
        value: https://sandbox.fapshi.com
      - key: FAPSHI_APIUSER
        sync: false
      - key: FAPSHI_APIKEY
        sync: false

  - type: web
    name: fnaad-admin
    runtime: static
    rootDir: fnaad-admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://fnaad-api.onrender.com/api
      - key: NODE_VERSION
        value: "20"

  - type: web
    name: fnaad-art
    runtime: static
    rootDir: fnaad-frontend
    buildCommand: npm install && npx expo export -p web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://fnaad-api.onrender.com/api
      - key: EXPO_PUBLIC_API_ORIGIN
        value: https://fnaad-api.onrender.com
      - key: NODE_VERSION
        value: "20"
